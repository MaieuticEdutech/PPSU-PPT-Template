# Render Blueprint — deploys the ppsu1 backend as a free Docker web service.
# In the Render dashboard: New + -> Blueprint -> pick this repo -> Apply.
#
# If the name "ppsu-ppt-designer" is taken, Render will suffix the URL; the
# actual URL then has to be copied into ppsu1/frontend/index.html
# (HOSTED_BACKEND constant) before deploying the frontend to Vercel.
services:
  - type: web
    name: ppsu-ppt-designer
    runtime: docker
    plan: free
    dockerfilePath: ./ppsu1/Dockerfile
    dockerContext: ./ppsu1
    healthCheckPath: /
    envVars:
      # The Vercel frontend's production origin (no trailing slash). Locks
      # CORS down to just this origin instead of allowing any.
      - key: FRONTEND_URL
        value: https://ppsu-ppt-template.vercel.app
      # The bundled 50 MB / 302-slide template OOM-crashes the 512 MB free
      # instance: parsing that much XML plus spawning LibreOffice to render
      # previews exceeds the ceiling (confirmed 2026-09-01 — the build died
      # ~19s in, right as LibreOffice launched, then the service 503'd for a
      # few seconds while Render restarted the container). The small template
      # (22 designs vs 285) fits comfortably and is the default until either
      # the app is optimized to avoid re-parsing the big template on every
      # build, or the instance is upgraded off the free plan.
      - key: DEFAULT_TEMPLATE_PATH
        value: "/app/template/PPSU TEMPLATE.pptx"
