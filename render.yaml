# Render Blueprint — deploys the ppsu1 backend as a free Docker web service.
# In the Render dashboard: New + -> Blueprint -> pick this repo -> Apply.
#
# If the name "ppsu-ppt-designer" is taken, Render will suffix the URL; the
# actual URL then has to be copied into ppsu1/frontend/index.html
# (HOSTED_BACKEND constant) before deploying the frontend to Vercel.
services:
  - type: web
    name: ppsu-ppt-designer
    runtime: docker
    plan: free
    dockerfilePath: ./ppsu1/Dockerfile
    dockerContext: ./ppsu1
    healthCheckPath: /
    envVars:
      # The Vercel frontend's production origin (no trailing slash). Locks
      # CORS down to just this origin instead of allowing any.
      - key: FRONTEND_URL
        value: https://ppsu-ppt-template.vercel.app
      # The bundled 50 MB / 302-slide template's COLD catalog build alone
      # peaks at ~840 MB (confirmed locally) -- well past the 512 MB free
      # instance, and would hit that path again any time the committed cache
      # is missing or stale. The small template (22 designs vs 285) is the
      # default until the instance is upgraded off the free plan.
      - key: DEFAULT_TEMPLATE_PATH
        value: "/app/template/PPSU TEMPLATE.pptx"
      # LibreOffice itself -- not template size, not concurrency -- is what
      # OOM-crashes this instance: confirmed 2026-09-02 by isolating each
      # cost. engine.build() alone (python-pptx, no rendering) peaked at just
      # ~61 MB even on a 23-slide deck; yet a single, solo /build still
      # silently killed the whole container (Render's log shows gunicorn
      # restart with zero warning -- a kernel OOM-kill signature, not a
      # Python error) within ~2 minutes of calling the renderer. A single
      # headless LibreOffice conversion carries large, largely fixed memory
      # overhead of its own that this instance cannot fit alongside the app,
      # regardless of template size or how many renders run at once. This
      # flag skips rendering entirely: /build still produces a real,
      # downloadable .pptx, only the PNG previews and "Change design"
      # thumbnails are unavailable (a state the app already handles
      # gracefully everywhere). Remove this once the instance is upgraded.
      - key: DISABLE_PREVIEW_RENDER
        value: "1"
